<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pracovní sešit 2</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Onest:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F5F8;--surface:#FFFFFF;--ink:#18263A;--muted:#5B6878;--line:#DCE2EA;
  --accent:#1D4E89;--accent-soft:#E3ECF7;--red:#B83A2E;--red-soft:#F8E6E3;
  --ok:#2E7D4F;--ok-soft:#E1F2E7;--bad:#B83A2E;--bad-soft:#F8E6E3;
  --ma:#1D6FB8;--mi:#274B7A;--f:#C0392B;--n:#2E7D4F;
  --display:"Literata",Georgia,serif;--body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0F1621;--surface:#172232;--ink:#E6ECF3;--muted:#98A6B8;--line:#2A394D;
  --accent:#7FB0EA;--accent-soft:#1D3150;--red:#E88A7E;--red-soft:#3A2220;
  --ok:#6FCB94;--ok-soft:#18362A;--bad:#E88A7E;--bad-soft:#3A2220;
  --ma:#7FB8EA;--mi:#A9BFE0;--f:#EE9A8F;--n:#7FD1A0;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0F1621;--surface:#172232;--ink:#E6ECF3;--muted:#98A6B8;--line:#2A394D;
  --accent:#7FB0EA;--accent-soft:#1D3150;--red:#E88A7E;--red-soft:#3A2220;
  --ok:#6FCB94;--ok-soft:#18362A;--bad:#E88A7E;--bad-soft:#3A2220;
  --ma:#7FB8EA;--mi:#A9BFE0;--f:#EE9A8F;--n:#7FD1A0;}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:24px 64px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(2rem,6vw,2.8rem)}h2{font-size:1.45rem}h3{font-size:1.08rem}
p{margin:0}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
header{display:flex;flex-direction:column;gap:10px}
.lead{color:var(--muted);max-width:62ch}
.progress{display:flex;align-items:center;gap:12px;font-size:.9rem;color:var(--muted);flex-wrap:wrap}
.bar{flex:1;min-width:140px;height:8px;background:var(--line);border-radius:99px;overflow:hidden;max-width:320px}
.bar i{display:block;height:100%;background:var(--red);width:0;transition:width .4s}
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-top:6px;scrollbar-width:none}
nav.tabs button{font:inherit;font-weight:600;background:none;border:0;color:var(--muted);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--red)}
nav.tabs button .ck{color:var(--ok);margin-left:4px}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.panel{display:flex;flex-direction:column;gap:22px}
.sechead{display:flex;flex-direction:column;gap:4px}
.pg{font-size:.82rem;color:var(--muted)}
.note{background:var(--accent-soft);padding:14px 16px;border-radius:10px;font-size:.95rem;display:flex;flex-direction:column;gap:6px}
.note b{color:var(--accent)}
.warn{background:var(--red-soft)}.warn b{color:var(--red)}
.note ul{margin:0;padding-left:18px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.say{font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--bg);color:var(--accent);border-radius:8px;padding:3px 9px;cursor:pointer;white-space:nowrap}
.hint{font-size:.87rem;color:var(--muted)}
.result{font-weight:600}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-height:104px}
.card .cz{font-family:var(--display);font-size:1.15rem;font-weight:700}
.card .ru{color:var(--muted)}
.hideru .card .ru:not(.shown){filter:blur(6px);user-select:none}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.tag{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.m{color:var(--ma)}.f{color:var(--f)}.mi{color:var(--mi)}.n{color:var(--n)}
/* tables */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:var(--surface);font-variant-numeric:tabular-nums;border-radius:12px;overflow:hidden}
th,td{padding:9px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.cz{font-family:var(--display);font-weight:700}
.end{color:var(--red)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.box ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
/* exercise shell */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.ex h3 small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:.85rem;margin-left:6px}
.ex.done{border-color:var(--ok)}
.qs{display:flex;flex-direction:column;gap:6px}
.q{display:flex;flex-wrap:wrap;align-items:center;gap:6px;line-height:2}
.q .who{font-weight:600;color:var(--muted)}
.q input{font:inherit;width:8em;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.q input.ok{border-color:var(--ok);background:var(--ok-soft)}
.q input.bad{border-color:var(--bad);background:var(--bad-soft)}
.q .gl{font-size:.82rem;color:var(--muted)}
.fix{font-size:.85rem;color:var(--bad)}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.keys button{font:inherit;min-width:36px;padding:3px 8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;cursor:pointer}
.bank{display:flex;flex-wrap:wrap;gap:6px;font-size:.9rem}
.bank span{padding:2px 10px;border:1px dashed var(--line);border-radius:6px}
/* drill */
.drill .prompt{font-family:var(--display);font-size:1.35rem;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.drill .prompt .big{font-size:2.4rem;line-height:1}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opts button{font:inherit;text-align:left;padding:10px 14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;cursor:pointer}
.opts button.ok{border-color:var(--ok);background:var(--ok-soft)}
.opts button.bad{border-color:var(--bad);background:var(--bad-soft)}
.meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.expl{font-size:.9rem;color:var(--muted)}
/* builder */
.target{min-height:48px;border:1px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.word{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.target .word{background:var(--accent-soft);border-color:transparent}
/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match button{font:inherit;text-align:left;padding:9px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;cursor:pointer}
.match button.sel{border-color:var(--accent);background:var(--accent-soft)}
.match button.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);cursor:default}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* alphabet & numbers */
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.abc button{font:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 6px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px}
.abc button b{font-family:var(--display);font-size:1.3rem}
.abc button span{font-size:.75rem;color:var(--muted);text-align:center;line-height:1.2}
.abc button.dia b{color:var(--red)}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.nums button{font:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 4px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center}
.nums button b{font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.nums button span{font-size:.85rem}
.spell{display:flex;flex-wrap:wrap;gap:6px}
.spell span{background:var(--accent-soft);border-radius:6px;padding:2px 8px;font-size:.9rem}
.spell span b{font-family:var(--display)}
input.txt{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%}
.dlg{display:flex;flex-direction:column;gap:4px}
footer{color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.match{grid-template-columns:1fr}}

.ex h3{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.num{font-family:var(--body);font-size:.8rem;font-weight:700;background:var(--red);color:#fff;border-radius:6px;padding:2px 8px;letter-spacing:.02em}
.ex.done .num{background:var(--ok)}
.q.tight{gap:0}.q.tight input{width:2.6em;text-align:center;margin-inline:2px}
.q input.wide{width:min(22em,100%)}
.q input.mid{width:11em}
.pick{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pgrp{display:inline-flex;gap:4px;flex-wrap:wrap}
.pgrp button{font:inherit;font-size:.95rem;padding:3px 10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;cursor:pointer}
.pgrp button.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:600}
.pgrp button.bad{border-color:var(--bad);background:var(--bad-soft);text-decoration:line-through}
.order{display:flex;flex-direction:column;gap:6px;counter-reset:ln}
.order button{font:inherit;text-align:left;padding:8px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;cursor:pointer}
.order.list button{background:var(--accent-soft);border-color:transparent}
.order.list button::before{counter-increment:ln;content:counter(ln) ". ";font-weight:700;color:var(--accent)}
.order.list button.ok{background:var(--ok-soft)}.order.list button.bad{background:var(--bad-soft)}
.lst{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.lst li{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.skip{font-size:.9rem;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px 14px}

.q input{line-height:1.4}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--accent);text-decoration:none;font-size:.95rem}
.back:hover{text-decoration:underline}
.topnav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.theory{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.theory h3{font-size:1.1rem}
.theory ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.dlgbox{display:flex;flex-direction:column;gap:3px;padding-left:12px;border-left:3px solid var(--accent-soft)}
.dlgbox b{color:var(--muted);font-weight:600}
.city{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:420px}
.city div{background:var(--accent-soft);border-radius:8px;padding:10px 6px;text-align:center;font-weight:600;font-size:.9rem}
.city div span{display:block;font-size:1.6rem}
.mail{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mail .hd{background:var(--accent-soft);padding:10px 14px;font-size:.88rem;display:flex;flex-direction:column;gap:2px}
.mail .bd{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.mail mark{background:var(--red-soft);color:inherit;padding:0 2px;border-radius:3px}
.reader{display:flex;flex-direction:column;gap:12px}
.rtext{display:flex;flex-direction:column;gap:10px;font-size:1.08rem;line-height:1.75;max-width:65ch}
.rtext .spk{color:var(--accent)}
.gw{border-bottom:2px dotted var(--accent);cursor:pointer;border-radius:3px}
.gw:hover,.gw.on{background:var(--accent-soft)}
.gloss{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:.95rem;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:4}
.wl summary{cursor:pointer;font-weight:600;color:var(--accent);padding-block:4px}
.wl table{margin-top:8px}
</style></head><body><div id="app"></div><script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.trim().toLowerCase().replace(/[.!?,„“"]/g,'').replace(/\s+/g,' ');
const arr=a=>Array.isArray(a)?a:[a];
const NUM=['nula','jedna','dva','tři','čtyři','pět','šest','sedm','osm','devět','deset'];
const TEEN=['deset','jedenáct','dvanáct','třináct','čtrnáct','patnáct','šestnáct','sedmnáct','osmnáct','devatenáct'];
const TENS=['','','dvacet','třicet','čtyřicet','padesát','šedesát','sedmdesát','osmdesát','devadesát'];
const HUN=['','sto','dvě stě','tři sta','čtyři sta','pět set','šest set','sedm set','osm set','devět set'];
function cz(n){if(n===0)return 'nula';const p=[];const t=Math.floor(n/1000),h=Math.floor(n%1000/100),r=n%100;
  if(t)p.push(t===1?'tisíc':t<5?(t===2?'dva':NUM[t])+' tisíce':cz(t)+' tisíc');if(h)p.push(HUN[h]);
  if(r)p.push(r<=10?NUM[r]:r<20?TEEN[r-10]:TENS[Math.floor(r/10)]+(r%10?' '+NUM[r%10]:''));return p.join(' ')}
const spoken=s=>s.replace(/@/g,' zavináč ').replace(/\./g,' tečka ').replace(/_/g,' podtržítko ').replace(/-/g,' pomlčka ');

let csVoice=null;
function say(t,rate=.85){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='cs-CZ';if(csVoice)u.voice=csVoice;u.rate=rate;speechSynthesis.speak(u)}catch(e){}}
const sayBtn=t=>`<button class="say" data-say="${esc(t)}" aria-label="Произнести">▶</button>`;
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){e.stopPropagation();say(b.dataset.say)}},true);
let lastInput=null;document.addEventListener('focusin',e=>{if(e.target.matches('.q input'))lastInput=e.target});
function keys(el){el.innerHTML=['á','é','í','ý','ó','ú','ů','ě','č','ř','š','ž','ň','ď','ť'].map(c=>`<button type="button" tabindex="-1">${c}</button>`).join('');
  $$('button',el).forEach(b=>b.onmousedown=e=>{e.preventDefault();if(lastInput)lastInput.setRangeText(b.textContent,lastInput.selectionStart,lastInput.selectionEnd,'end')})}
const actions=(extra='')=>`<div class="actions">${extra}<span class="result"></span></div>`;

function KURZ(cfg){
  const KEY=cfg.key;let done=store.get(KEY,{});const ALL=[];
  document.title=cfg.docTitle||cfg.title;
  $('#app').innerHTML=`<div class="wrap"><div class="topnav"><a class="back" href="index.html">← Все уроки</a>${cfg.other?`<a class="back" href="${cfg.other[0]}">${cfg.other[1]} →</a>`:''}</div>
   <header><span class="eyebrow">${cfg.eyebrow}</span><h1>${cfg.title}</h1><p class="lead">${cfg.lead}</p>
   <div class="progress"><span>Выполнено</span><div class="bar"><i id="pbar"></i></div><span id="ptext"></span><button class="say" id="resetAll">сбросить</button></div><p class="hint" id="ttsHint"></p></header>
   <nav class="tabs" role="tablist" id="tabs"></nav><main id="panels"></main><footer>${cfg.footer||''}</footer></div>`;
  try{const pick=()=>{csVoice=speechSynthesis.getVoices().find(x=>/^cs/i.test(x.lang))||null;$('#ttsHint').textContent=csVoice?'':'На этом устройстве нет чешского голоса, поэтому озвучка может звучать с акцентом.'};pick();speechSynthesis.onvoiceschanged=pick}catch(e){$('#ttsHint').textContent='Озвучка в этом браузере недоступна.'}
  const mark=n=>{done[n]=true;store.set(KEY,done);drawP()};
  function drawP(){const k=ALL.filter(n=>done[n]).length;$('#pbar').style.width=(ALL.length?k/ALL.length*100:0)+'%';$('#ptext').textContent=`${k} из ${ALL.length} ${cfg.unit||'упражнений'}`;
    store.set('kp:'+cfg.page,{d:k,t:ALL.length});
    ALL.forEach(n=>{const e=document.getElementById('x-'+n);if(e)e.classList.toggle('done',!!done[n])});
    cfg.tabs.forEach(t=>{const b=$(`#tabs [data-tab="${t.id}"] .ck`);const ex=t.ex.filter(e=>ALL.includes(e.n));if(b)b.textContent=ex.length&&ex.every(e=>done[e.n])?'✓':''})}

  const E={};
  E.html=(ex,sp)=>{$('.body',ex).innerHTML=sp.html};
  E.cards=(ex,sp)=>{const b=$('.body',ex);b.innerHTML=`<div class="actions"><button class="btn ghost" data-h>Скрыть перевод</button></div><div class="cards">${sp.items.map(c=>`<div class="card" tabindex="0"><span class="cz ${c[3]||''}">${c[0]}</span><span class="ru">${c[1]}</span><div class="row"><span class="tag">${c[2]||''}</span>${sayBtn(c[0].replace(/<[^>]+>/g,''))}</div></div>`).join('')}</div>`;
    $$('.card',b).forEach(c=>{const t=()=>$('.ru',c).classList.toggle('shown');c.onclick=e=>{if(!e.target.closest('.say'))t()};c.onkeydown=e=>{if(e.key==='Enter')t()}});
    $('[data-h]',b).onclick=e=>{b.classList.toggle('hideru');e.target.textContent=b.classList.contains('hideru')?'Показать перевод':'Скрыть перевод'}};
  E.fill=(ex,sp)=>{const b=$('.body',ex);const size=sp.size||'';
    b.innerHTML=(sp.intro?`<div>${sp.intro}</div>`:'')+(sp.bank?`<div class="bank">${sp.bank.map(w=>`<span>${w}</span>`).join('')}</div>`:'')+`<div class="keys"></div><div class="qs"></div>`+actions('<button class="btn" data-check>Проверить</button><button class="btn ghost" data-again>Заново</button>');
    keys($('.keys',b));const qs=$('.qs',b),res=$('.result',b);const gaps=sp.items.filter(q=>q.a!=null);
    const build=()=>{let n=0;qs.innerHTML=sp.items.map((q,i)=>q.a==null?`<div class="q">${q.w!=null?`<span class="who">${q.w}</span>`:''}<span>${q.p||''}</span></div>`:
      `<div class="q ${size==='tight'?'tight':''}" data-i="${i}">${q.w!=null?`<span class="who">${q.w}</span>`:`<span class="gl" style="min-width:1.6em">${++n}.</span>`}<span>${q.p||''}</span><input class="${q.size||size}" autocomplete="off" spellcheck="false" aria-label="ответ"><span>${q.s||''}</span>${q.g?`<span class="gl">&nbsp;${q.g}</span>`:''}<span class="fix"></span></div>`).join('');res.textContent=''};
    build();
    $('[data-check]',b).onclick=()=>{let ok=0;$$('.q[data-i]',qs).forEach(r=>{const it=sp.items[+r.dataset.i],inp=$('input',r),good=arr(it.a).some(a=>norm(a)===norm(inp.value));
      inp.classList.toggle('ok',good);inp.classList.toggle('bad',!good);$('.fix',r).textContent=good?'':' → '+arr(it.a)[0];if(good)ok++});

function readHtml(sp){const W=sp.words.slice().sort((a,b)=>b[0].length-a[0].length);
  const re=new RegExp('(?<![\\p{L}])('+W.map(w=>w[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\p{L}])','giu');
  const map=Object.fromEntries(W.map(w=>[w[0].toLowerCase(),w[1]]));
  const wrap=t=>esc(t).replace(re,m=>`<span class="gw" tabindex="0" data-ru="${esc(map[m.toLowerCase()]||'')}">${m}</span>`);
  const paras=sp.paras.map(p=>{const m=p.match(/^([A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ][\p{L}]+):\s(.*)$/u);return `<p>${m?`<b class="spk">${m[1]}:</b> ${wrap(m[2])}`:wrap(p)} ${sayBtn(m?m[2]:p)}</p>`}).join('');
  const full=sp.paras.map(p=>p.replace(/^[^:\s]+:\s/,'')).join(' ');
  return `<div class="reader"><div class="actions"><button class="btn ghost" data-say="${esc(full)}">▶ Слушать весь текст</button><span class="hint">Нажмите на подчёркнутое слово, чтобы увидеть перевод.</span></div>
   <div class="rtext">${paras}</div><div class="gloss" aria-live="polite">Нажмите на слово в тексте</div>
   <details class="wl"><summary>Слова к тексту (${sp.words.length})</summary><div class="tablewrap"><table><tbody>${sp.words.map(w=>`<tr><td class="cz">${w[0]} ${sayBtn(w[0])}</td><td>${w[1]}</td></tr>`).join('')}</tbody></table></div></details></div>`}
document.addEventListener('click',e=>{const g=e.target.closest('.gw');if(!g)return;const box=g.closest('.reader').querySelector('.gloss');box.innerHTML=`<b>${g.textContent}</b> — ${g.dataset.ru}`;$$('.gw.on').forEach(x=>x.classList.remove('on'));g.classList.add('on');say(g.textContent)});
